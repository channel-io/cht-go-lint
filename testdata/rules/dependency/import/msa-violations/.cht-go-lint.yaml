# Broken service — proves the template's layer x domain COMBINATION: one layer
# definition enforces BOTH layer direction and domain isolation, in every domain,
# with zero per-domain repetition. This is the property depguard / go-arch-lint
# cannot express together (see the RFC's "combination" requirement).
module: example.com/badsvc
location:
  strategy: node-tree
roots: [internal/domain]
rules:
  dependency/import: error

templates:
  layers:
    model: { shared: true }          # every domain's model is importable within it
    svc: { may_import: [model] }      # svc -> model (down) only
    appsvc: { may_import: [svc] }     # appsvc -> svc (+ model via shared)
default_template: layers              # applied to app AND order — one definition

children:
  app: {}                            # no cross-domain edge
  order: {}                          # no cross-domain edge -> order is walled from app
