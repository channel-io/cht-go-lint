# Example service on the node-tree model, mirroring the channeltalk/msa-v2 layers
# and directions. Domains live under internal/domain. Layers are wired per
# msa-v2; domains are isolated and cross only through a public layer.
module: example.com/svc
location:
  strategy: node-tree
roots: [internal/domain]
rules:
  dependency/import: error
children:
  app:
    may_import: [order]   # app may reach order (Go internal/ keeps it to order's public packages)
  order: {}
